services:
  - type: web
    name: youtube-mp3-backend
    env: node
    plan: free
    region: oregon
    buildCommand: |
      # Install Node.js dependencies
      npm install
      # Install Python dependencies
      pip install -r requirements.txt
      # Install FFmpeg
      apt-get update && apt-get install -y ffmpeg
    startCommand: node server.js  # CHANGE THIS LINE
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: RENDER
        value: "true"
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: downloads
      mountPath: /opt/render/project/src/downloads
      sizeGB: 1